org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true

# AGP 9 默认内置 Kotlin，但内置的是 2.2.10，而 Miuix 0.9.4-rc01 用 Kotlin 2.4.x 编译，
# 版本不兼容会导致 stdlib 元数据读取失败、全部 Kotlin 文件连锁报错。
# 因此关掉内置 Kotlin，改用根项目显式声明的 2.4.20。
android.builtInKotlin=false

# 但独立的 org.jetbrains.kotlin.android 插件与 AGP 9 的新 DSL 不兼容，
# 官方给出的出路就是关掉新 DSL（报错信息里明确写了这条）。
android.newDsl=false
